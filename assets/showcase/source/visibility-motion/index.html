<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1600,height=900">
    <title>悬浮便签 · 窗口切换可见性演示</title>
    <script src="./gsap.min.js"></script>
    <style>
      @font-face { font-family: "Showcase Chinese"; src: local("PingFang SC"); }
      :root { --paper:#f8f6ef; --ink:#252c27; --olive:#52634a; }
      * { box-sizing:border-box; }
      html, body { width:1600px; height:900px; margin:0; overflow:hidden; }
      body { font-family:"Showcase Chinese", sans-serif; color:var(--ink); }
      #visibility { position:relative; width:1600px; height:900px; overflow:hidden; }
      .background { position:absolute; inset:0; background:var(--paper); }
      .title {
        position:absolute; left:78px; top:54px; width:1100px; margin:0;
        font-size:56px; line-height:1.15; font-weight:650; letter-spacing:-.035em;
      }
      .stage {
        position:absolute; left:76px; top:190px; width:1448px; height:550px;
        overflow:hidden; border:1px solid rgba(37,44,39,.16); border-radius:18px;
        background:#e8e8e1; box-shadow:0 22px 55px rgba(37,44,39,.10);
      }
      .work-window {
        position:absolute; inset:0; overflow:hidden; background:#fff;
        transform:translate3d(0,0,0);
      }
      .web-window { opacity:0; transform:translate3d(72px,0,0); }
      .window-bar {
        height:58px; display:flex; align-items:center; padding:0 28px;
        border-bottom:1px solid rgba(37,44,39,.11); background:#f1f1eb;
      }
      .window-label { font-size:22px; line-height:1; font-weight:620; color:var(--ink); }
      .window-context { margin-left:18px; font-size:16px; color:rgba(37,44,39,.72); }
      .document-layout { display:grid; grid-template-columns:228px 1fr; height:492px; }
      .document-nav { padding:34px 30px; background:#f5f4ef; border-right:1px solid rgba(37,44,39,.09); }
      .nav-heading { margin-bottom:24px; font-size:14px; font-weight:650; color:var(--olive); letter-spacing:.08em; }
      .nav-item { margin:17px 0; font-size:17px; color:rgba(37,44,39,.72); }
      .nav-item.active { color:var(--ink); font-weight:620; }
      .document-page { width:760px; padding:48px 66px; }
      .eyebrow { margin-bottom:13px; color:var(--olive); font-size:15px; font-weight:650; letter-spacing:.1em; }
      .document-page h2, .reference-copy h2 { margin:0; font-size:34px; line-height:1.25; font-weight:650; letter-spacing:-.02em; }
      .document-page p, .reference-copy p { margin:22px 0 0; font-size:20px; line-height:1.75; color:rgba(37,44,39,.72); }
      .quote {
        margin-top:30px; padding:21px 25px; width:620px; border-left:4px solid var(--olive);
        background:#f5f5ee; font-size:18px; line-height:1.55; color:rgba(37,44,39,.78);
      }
      .web-layout { height:492px; padding:38px 44px 42px; background:#fbfbf8; }
      .reference-shell { display:grid; grid-template-columns:600px 1fr; gap:34px; height:100%; }
      .reference-copy { padding:22px 24px; }
      .reference-copy p { width:530px; }
      .reference-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-content:start; padding-top:18px; }
      .reference-card { min-height:138px; padding:22px; border:1px solid rgba(37,44,39,.12); border-radius:12px; background:#fff; }
      .reference-card.wide { grid-column:1 / 3; min-height:128px; }
      .card-kicker { color:var(--olive); font-size:14px; font-weight:650; letter-spacing:.08em; }
      .card-title { margin-top:12px; font-size:20px; line-height:1.35; font-weight:620; }
      .card-copy { margin-top:10px; color:rgba(37,44,39,.72); font-size:16px; line-height:1.5; }
      .note {
        position:absolute; left:1006px; top:254px; width:470px; height:auto; z-index:10;
        display:block; border-radius:8px; filter:drop-shadow(0 24px 27px rgba(37,44,39,.25));
      }
      .caption {
        position:absolute; left:78px; bottom:54px; margin:0;
        font-size:24px; line-height:1.3; color:var(--olive); letter-spacing:.015em;
      }
    </style>
  </head>
  <body>
    <main id="visibility" data-composition-id="visibility" data-start="0" data-duration="6" data-width="1600" data-height="900">
      <div id="visibility-background" class="background clip" data-start="0" data-duration="6" data-track-index="0"></div>

      <h1 id="visibility-title" class="title clip" data-start="0" data-duration="6" data-track-index="1">窗口换了，记下的事还在。</h1>

      <section id="visibility-stage" class="stage clip" data-start="0" data-duration="6" data-track-index="2" aria-label="普通工作窗口切换演示">
        <article id="document-window" class="work-window document-window" data-layout-allow-occlusion data-layout-allow-overlap>
          <header class="window-bar">
            <span class="window-label">正在写的文档</span>
            <span class="window-context">项目计划 / 本周重点</span>
          </header>
          <div class="document-layout">
            <aside class="document-nav">
              <div class="nav-heading">工作区</div>
              <div class="nav-item active">本周计划</div>
              <div class="nav-item">项目资料</div>
              <div class="nav-item">会议记录</div>
              <div class="nav-item">待整理</div>
            </aside>
            <div class="document-page">
              <div class="eyebrow">周三 · 工作记录</div>
              <h2>准备下一次提案</h2>
              <p>先确认目标和讲述顺序，再选几张能说明问题的参考图。</p>
              <div class="quote">下午两点前：整理好提案的最后一页。</div>
            </div>
          </div>
        </article>

        <article id="web-window" class="work-window web-window" data-layout-allow-occlusion data-layout-allow-overlap>
          <header class="window-bar">
            <span class="window-label">刚打开的网页</span>
            <span class="window-context">设计参考 / 阅读中</span>
          </header>
          <div class="web-layout">
            <div class="reference-shell">
              <div class="reference-copy">
                <div class="eyebrow">DESIGN NOTES</div>
                <h2>海报里的留白与色彩</h2>
                <p>找几张色彩克制、版面清楚的海报，放进下一次提案的参考页。</p>
              </div>
              <div class="reference-grid">
                <div class="reference-card">
                  <div class="card-kicker">色彩</div>
                  <div class="card-title">低饱和的自然色</div>
                  <div class="card-copy">暖白、草绿，再加一点浅黄。</div>
                </div>
                <div class="reference-card">
                  <div class="card-kicker">版式</div>
                  <div class="card-title">把留白留给重点</div>
                  <div class="card-copy">标题清楚，正文不必填满。</div>
                </div>
                <div class="reference-card wide">
                  <div class="card-kicker">参考方向</div>
                  <div class="card-title">有呼吸感的版面，让内容更容易被读到。</div>
                </div>
              </div>
            </div>
          </div>
        </article>
      </section>

      <img id="visibility-note" class="note clip" data-start="0" data-duration="6" data-track-index="3" src="./assets/daily.png" alt="悬浮在工作窗口上方的黄色便签">
      <p id="visibility-caption" class="caption clip" data-start="0" data-duration="6" data-track-index="4">始终置顶在普通工作窗口上方</p>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused:true });

        tl.to('#document-window', {
          x:-54,
          opacity:0.18,
          duration:0.72,
          ease:'power2.inOut'
        }, 1.08);
        tl.to('#web-window', {
          x:0,
          opacity:1,
          duration:0.72,
          ease:'power2.inOut'
        }, 1.08);

        tl.to('#web-window', {
          x:72,
          opacity:0,
          duration:0.72,
          ease:'power2.inOut'
        }, 4.18);
        tl.to('#document-window', {
          x:0,
          opacity:1,
          duration:0.72,
          ease:'power2.inOut'
        }, 4.18);

        window.__timelines['visibility'] = tl;
        tl.seek(0);
      </script>
    </main>
  </body>
</html>
